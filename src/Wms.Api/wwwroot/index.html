<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Warehouse / Operations</title><link rel="stylesheet" href="warehouse.css"><script defer src="warehouse.js"></script></head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">▦</span> Warehouse</div><nav><a href="/swagger" data-label="docs">API reference</a><label><span class="sr" data-label="language">Language</span><select id="language"><option value="en">English</option><option value="uk">Українська</option></select></label><button id="logout" hidden data-label="logout">Sign out</button></nav></header>
<main><section id="welcome" class="welcome"><div><p class="eyebrow">WMS / <span data-label="operations">Operations</span></p><h1 data-label="heading">Warehouse operations</h1><p class="intro" data-label="intro">Track stock, spot shortages and review the latest inventory movements.</p>
<div class="racks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<form id="login"><h2 data-label="login">Sign in</h2><label><span data-label="username">Username or email</span><input id="username" autocomplete="username" required></label><label><span data-label="password">Password</span><input type="password" id="password" autocomplete="current-password" required></label><button class="primary" data-label="open">Open workspace</button><p id="error" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="bar"><div><p class="eyebrow">WMS / <span data-label="operations">Operations</span></p><h1 data-label="overview">Inventory overview</h1></div><button id="refresh" data-label="refresh">Refresh</button></div><p id="status" role="status"></p><div id="metrics"></div>
<section class="card"><h2 data-label="alerts">Low-stock alerts</h2><div class="scroll"><table><thead><tr><th>SKU</th><th data-label="product">Product</th><th data-label="warehouse">Warehouse</th><th data-label="available">Available</th><th data-label="threshold">Reorder level</th></tr></thead><tbody id="alerts"></tbody></table></div></section>
<section class="card"><h2 data-label="recent">Recent stock movements</h2><div class="scroll"><table><thead><tr><th data-label="date">Date</th><th data-label="product">Product</th><th data-label="type">Movement</th><th data-label="quantity">Quantity</th></tr></thead><tbody id="movements"></tbody></table></div></section></section>
</main></body></html>
