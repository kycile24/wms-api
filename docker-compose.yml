services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${WMS_DB_PASSWORD:?Set WMS_DB_PASSWORD}
    volumes:
      - warehouse-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
  wms.api:
    build:
      context: .
      dockerfile: src/Wms.Api/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=database;Database=Warehouse;User Id=sa;Password=${WMS_DB_PASSWORD};TrustServerCertificate=True"
      JwtSettings__Secret: ${WMS_JWT_SECRET:?Set WMS_JWT_SECRET}
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  warehouse-data:
